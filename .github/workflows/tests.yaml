---
name: Tests

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: Bats
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Run Bats in the app's base image
        # The base image provides the bash, jq and bashio the app runs with
        run: |
          docker run --rm --entrypoint sh -v "${PWD}:/repo:ro" -w /repo \
            "$(sed -n 's/^ARG BUILD_FROM=//p' tailscale/Dockerfile)" \
            -c 'apk add --no-cache bats && BASHIO_LIB=/usr/lib/bashio bats tests'
