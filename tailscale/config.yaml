---
name: Tailscale
version: dev
slug: tailscale
description: Zero config VPN for building secure networks
url: https://github.com/hassio-addons/app-tailscale
ingress: true
ingress_port: 0
ingress_stream: true
startup: services
panel_icon: mdi:vpn
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
host_network: true
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
devices:
  - /dev/net/tun
map:
  - homeassistant_config:rw
  - addon_config:rw
  - ssl:rw
  - addons:rw
  - backup:rw
  - share:rw
  - media:rw
  - all_addon_configs:rw
ports:
  41641/udp: null
schema:
  accept_dns: bool?
  accept_routes: bool?
  advertise_exit_node: bool?
  advertise_connector: bool?
  advertise_routes:
    - "match(^(((25[0-5]|(2[0-4]|1\\d|[1-9]?)\\d)\\.){3}(25[0-5]|(2[0-4]|1\\d|[1-9]?)\\d)\\/(3[0-2]|[12]?\\d)|[a-fA-F\\d.:]+:[a-fA-F\\d.:]+\\/(12[0-8]|(1[01]|[1-9]?)\\d))$)?"
  exit_node: "match(^(?:(?:(?:25[0-5]|(?:2[0-4]|1\\d|[1-9]?)\\d)\\.){3}(?:25[0-5]|(?:2[0-4]|1\\d|[1-9]?)\\d)|[a-fA-F\\d.:]+:[a-fA-F\\d.:]+|[a-fA-F\\d]{8}(?:-[a-fA-F\\d]{4}){3}-[a-fA-F\\d]{12}|auto:any)$)?"
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  login_server: url?
  share_homeassistant: list(disabled|serve|funnel)?
  share_on_port: match(^(443|8443|10000)$)?
  snat_subnet_routes: bool?
  stateful_filtering: bool?
  tags:
    - "match(^tag:[a-zA-Z][a-zA-Z0-9-]*$)?"
  taildrop: bool?
  taildrive:
    - "match(^(?i:(homeassistant_config|addon_config|ssl|addons|backup|share|media))$)"
  userspace_networking: bool?
